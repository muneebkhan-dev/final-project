<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <link rel="stylesheet" href="assests/css/layout.css">
    <link rel="stylesheet" href="assests/css/style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

            em=document.getElementById('em').value;

            Lnm=document.getElementById('Lnm').value;

            }

    </script>
</head>

<body>

    <section class="section">

        <div class="main">

            
            <div class="title">

                <h2 class="pt-1">Signup</h2>

                <span class="position-absolute top-0 end-0">
                    <i class="fa-solid fa-circle-xmark icon"></i>
                </span>

            </div>


            
            <div class="hero">

                <h5 class="my-3 ms-2">
                    Already have an account?
                    <span class="text-primary">Login.</span>
                </h5>

                <h4 class="text-primary ms-2 mt-5">
                    Login
                   
                </h4>

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdYdIroHneLxjIIY8rewSbjtuEN6Sj6QNZrpXSp17z8Q&s=10"
                    class="img"
                    alt="GIIT Logo">

            </div>


            
            <div class="form-area">

                <table>

                    <tr>
                        <td>Username:</td>
                        <td>
                            <input type="text" id="Unm">
                        </td>
                    </tr>

                    <tr>
                        <td>Password:</td>
                        <td>
                            <input type="password" id="pass">
                        </td>
                    </tr>

                    <tr>
                        <td>Confirm Password:</td>
                        <td>
                            <input type="password" id="cpass">
                        </td>
                    </tr>

                    <tr>
                        <td>Email Address:</td>
                        <td>
                            <input type="email" id="em">
                        </td>
                    </tr>

                    <tr>
                        <td>First Name:</td>
                        <td>
                            <input type="text" id="nm">
                        </td>
                    </tr>

                    <tr>
                        <td>Last Name:</td>
                        <td>
                            <input type="text" id="Lnm">
                        </td>
                    </tr>

                </table>

            </div>

            

            <div class="mb-3 ms-3 form-check">
                <input type="checkbox" class="form-check-input" id="checkbox">
                <label class="form-check-label" for="exampleCheck1">
                    I have read the Groveshark Terms of Service (Open in a new window)
                </label>
            </div>

          

            <div class="button">
                <button type="submit" class="btn btn-outline-secondary px-3 mt-1" onclick="Result()">Signup</button>
            </div>

        </div>

    </section>

</body>
</html>
